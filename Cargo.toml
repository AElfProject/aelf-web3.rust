[workspace]
members = [
    "crates/aelf-sdk",
    "crates/aelf-client",
    "crates/aelf-contract",
    "crates/aelf-crypto",
    "crates/aelf-keystore",
    "crates/aelf-proto",
]
resolver = "2"

[workspace.package]
authors = ["AElf <devops@aelf.io>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/AElfProject/aelf-web3.rust"
rust-version = "1.85"
version = "0.1.0-alpha.0"

[workspace.dependencies]
async-trait = "0.1.89"
aes = "0.8.4"
base64 = "0.22.1"
bs58 = "0.5.1"
bytes = "1.10.1"
cbc = "0.1.2"
cipher = "0.4.4"
coins-bip32 = "0.13.0"
coins-bip39 = "0.13.0"
ctr = "0.9.2"
hex = "0.4.3"
http = "1.3.1"
lru = "0.16.3"
pbjson = "0.9.0"
pbjson-build = "0.9.0"
pbjson-types = "0.9.0"
pbkdf2 = "0.12.2"
prost = "0.14.3"
prost-build = "0.14.3"
prost-reflect = { version = "0.16.3", features = ["serde"] }
prost-types = "0.14.3"
protoc-bin-vendored = "3.2.0"
rand = "0.9.2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "rustls", "http2"] }
salsa20 = "0.10.2"
scrypt = "0.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0.18"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
